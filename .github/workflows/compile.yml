name: Compile educational TRC20

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compile contract
        run: npm run compile
      - name: Verify compiled ABI and bytecode
        run: npm run check
      - name: Create flattened Solidity source for TronIDE
        run: npx tronbox flatten contracts/FlashUsdtDemo.sol > FlashUsdtDemo.flattened.sol
      - name: Attach downloadable build files
        uses: actions/upload-artifact@v4
        with:
          name: tron-demo-contract-build
          path: |
            build/contracts/FlashUsdtDemo.json
            FlashUsdtDemo.flattened.sol
          if-no-files-found: error
          retention-days: 30
